<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socrates</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">

        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu" title="Toggle menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <span class="brand">Socrates</span>
      </div>
      <nav class="nav">
        <a href="#/arrays" data-route="arrays" title="Arrays">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 3v18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M7 14l4-4 3 3 5-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Arrays</span>
        </a>
        <a href="#/blog" data-route="blog" title="Blog">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 3h10l4 4v14H5z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M8 11h8M8 15h8M8 7h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Blog</span>
        </a>
        <a href="#/logs" data-route="logs" title="Logs">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M7 9l3 3-3 3M12 15h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Logs</span>
        </a>
        <a href="#/settings/archive" data-route="settings" title="Settings" id="settingsMenu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Settings</span>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="sub" href="#/settings/archive" data-route="settings" data-sub="archive" title="Archive"><span>Archive</span></a>
        <a class="sub" href="#/settings/markets" data-route="settings" data-sub="markets" title="Markets"><span>Markets</span></a>
        <a class="sub" href="#/settings/routines" data-route="settings" data-sub="routines" title="Routines"><span>Routines</span></a>
        <a class="sub" href="#/settings/charts" data-route="settings" data-sub="charts" title="Charts"><span>Charts</span></a>
      </nav>
      <a class="version" id="appVersion" href="https://github.com/FatoYo/socrates" target="_blank" rel="noopener noreferrer" title="Source code on GitHub">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
        <span class="version-text">dev</span>
      </a>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="mobile-bar">
        <button class="icon-btn" id="mobileMenu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <span class="brand">Socrates</span>
        <span class="mobile-page" id="mobilePage"></span>
      </header>

      <section class="page" id="page-arrays" hidden></section>
      <section class="page" id="page-blog" hidden></section>
      <section class="page" id="page-logs" hidden></section>
      <section class="page" id="page-settings" hidden></section>
    </main>
  </div>

  <div class="popover calendar" id="calendar" hidden></div>
  <div class="modal" id="search" hidden>
    <div class="modal-box" role="dialog" aria-label="Find ticker">
      <input type="text" id="searchInput" placeholder="Type a ticker symbol…" autocomplete="off" spellcheck="false">
      <ul class="search-results" id="searchResults"></ul>
      <div class="modal-hint"><kbd>↑</kbd><kbd>↓</kbd> choose · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</div>
    </div>
  </div>

  <script src="/static/core.js"></script>
  <script src="/static/chart.js"></script>
  <script src="/static/arrays.js"></script>
  <script src="/static/blog.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/logs.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
